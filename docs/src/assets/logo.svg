<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">ReSolver-RectangularGrids.jl logo</title>
  <desc id="desc">A rectangular product grid with Julia-colored bounded faces and arrows wrapping around its periodic direction, beside the ReSolver-RectangularGrids.jl wordmark.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f5f8"/>
    </linearGradient>
    <linearGradient id="grid-face" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="panel-shadow" x="-12%" y="-25%" width="124%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#172033" flood-opacity="0.14"/>
    </filter>
    <filter id="grid-shadow" x="-25%" y="-30%" width="150%" height="165%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#172033" flood-opacity="0.16"/>
    </filter>
    <marker id="periodic-arrow" viewBox="0 0 12 10" refX="9" refY="5" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0 0 L12 5 L0 10 Z" fill="#222734"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="912" height="252" rx="24" fill="url(#panel)" filter="url(#panel-shadow)"/>

  <!-- Rectangular product grid: colored edges are bounded faces; the curved arrows are periodic. -->
  <g transform="translate(62 51)" filter="url(#grid-shadow)">
    <path d="M45 52 L76 29 L248 29 L217 52 Z" fill="#9558b2" fill-opacity="0.14" stroke="#c7cdd8" stroke-width="2"/>
    <path d="M217 52 L248 29 L248 145 L217 169 Z" fill="#4063d8" fill-opacity="0.13" stroke="#c7cdd8" stroke-width="2"/>
    <rect x="45" y="52" width="172" height="117" rx="2" fill="url(#grid-face)" stroke="#aab2c0" stroke-width="2"/>

    <g fill="none" stroke="#c7cdd8" stroke-width="2">
      <path d="M88 52 V169 M131 52 V169 M174 52 V169"/>
      <path d="M45 81 H217 M45 110 H217 M45 139 H217"/>
      <path d="M76 29 V52 M119 29 V52 M162 29 V52 M205 29 V52" opacity="0.8"/>
      <path d="M217 81 L248 58 M217 110 L248 87 M217 139 L248 116" opacity="0.8"/>
    </g>

    <g fill="none" stroke-linecap="round" stroke-width="7">
      <path d="M45 53 H217" stroke="#9558b2"/>
      <path d="M45 168 H217" stroke="#389826"/>
      <path d="M46 53 V168" stroke="#cb3c33"/>
      <path d="M216 53 V168" stroke="#4063d8"/>
    </g>

    <g fill="#ffffff" stroke-width="4">
      <circle cx="45" cy="52" r="7" stroke="#cb3c33"/>
      <circle cx="217" cy="52" r="7" stroke="#4063d8"/>
      <circle cx="45" cy="169" r="7" stroke="#389826"/>
      <circle cx="217" cy="169" r="7" stroke="#4063d8"/>
    </g>

    <g fill="none" stroke="#222734" stroke-width="4" stroke-linecap="round">
      <path d="M57 32 C92 4, 214 3, 251 31" marker-end="url(#periodic-arrow)"/>
      <path d="M243 178 C202 204, 85 205, 43 178" marker-end="url(#periodic-arrow)"/>
    </g>
  </g>

  <g transform="translate(349 84)">
    <text x="0" y="52" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="42" font-weight="820" fill="#222734" textLength="558" lengthAdjust="spacingAndGlyphs">ReSolver-RectangularGrids.jl</text>
    <text x="2" y="94" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#4f596b">Rectangular product grids and canonical</text>
    <text x="2" y="122" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#4f596b">incompressible-flow cases for NSEBase.jl.</text>
  </g>
</svg>
