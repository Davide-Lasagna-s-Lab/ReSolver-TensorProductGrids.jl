name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and examples · Julia ${{ matrix.version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            version: '1.10'
            coverage: false
          - os: ubuntu-latest
            version: '1'
            coverage: true
          - os: macos-latest
            version: '1'
            coverage: false
          - os: windows-latest
            version: '1'
            coverage: false

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v2

      - name: Install tested upstream branches
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.add([
                PackageSpec(url="https://github.com/Davide-Lasagna-s-Lab/NSEBase.jl", rev="dev"),
                PackageSpec(url="https://github.com/Davide-Lasagna-s-Lab/FDGrids.jl", rev="master"),
            ])
            Pkg.instantiate()
            Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)'

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.coverage }}

      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage

      - uses: codecov/codecov-action@v5
        if: matrix.coverage
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false
          verbose: true
