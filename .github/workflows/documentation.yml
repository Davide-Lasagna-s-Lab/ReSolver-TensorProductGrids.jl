name: Documentation

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  statuses: write

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Strict manual and doctests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - uses: julia-actions/cache@v2

      - name: Install documentation and tested upstream branches
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.add([
                PackageSpec(url="https://github.com/Davide-Lasagna-s-Lab/NSEBase.jl", rev="dev"),
                PackageSpec(url="https://github.com/Davide-Lasagna-s-Lab/FDGrids.jl", rev="master"),
            ])
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()
            Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)'

      - name: Build, check links, and deploy documentation
        env:
          DOCUMENTER_LINKCHECK: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs docs/make.jl
